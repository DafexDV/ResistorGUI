<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Resistor GUI</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f9df0"/>
      <stop offset="1" stop-color="#2472c8"/>
    </linearGradient>
    <clipPath id="bgClip">
      <rect width="256" height="256" rx="60"/>
    </clipPath>
    <clipPath id="bodyClip">
      <polygon points="40,80 80,92 176,92 216,80 216,176 176,164 80,164 40,176"/>
    </clipPath>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="140%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- Fondo estilo Papirus -->
  <g clip-path="url(#bgClip)">
    <rect width="256" height="256" fill="url(#bg)"/>
    <!-- Brillo superior y borde inferior -->
    <rect width="256" height="128" fill="#fff" opacity="0.08"/>
    <rect y="248" width="256" height="8" fill="#000" opacity="0.15"/>
    <rect width="256" height="3" fill="#fff" opacity="0.25"/>
  </g>

  <!-- Sombra proyectada -->
  <g fill="#0a2a55" opacity="0.35" filter="url(#soft)" transform="translate(0,10)">
    <rect x="16" y="121" width="48" height="14" rx="7"/>
    <rect x="192" y="121" width="48" height="14" rx="7"/>
    <polygon points="40,80 80,92 176,92 216,80 216,176 176,164 80,164 40,176"
             stroke="#0a2a55" stroke-width="6" stroke-linejoin="round"/>
  </g>

  <!-- Cables (plano, con mitad inferior más oscura) -->
  <g>
    <rect x="16" y="121" width="48" height="14" rx="7" fill="#d0d4d9"/>
    <rect x="192" y="121" width="48" height="14" rx="7" fill="#d0d4d9"/>
    <path d="M16 128h48v0a7 7 0 0 1-7 7H23a7 7 0 0 1-7-7z" fill="#9aa1a9"/>
    <path d="M192 128h48v0a7 7 0 0 1-7 7h-34a7 7 0 0 1-7-7z" fill="#9aa1a9"/>
  </g>

  <!-- Cuerpo -->
  <polygon points="40,80 80,92 176,92 216,80 216,176 176,164 80,164 40,176"
           fill="#e8c78c" stroke="#e8c78c" stroke-width="6" stroke-linejoin="round"/>

  <!-- Bandas y sombreado a dos tonos, recortados al cuerpo -->
  <g clip-path="url(#bodyClip)">
    <rect x="62"  y="70" width="20" height="116" fill="#f03e3e"/>
    <rect x="98"  y="70" width="20" height="116" fill="#8a3ffc"/>
    <rect x="134" y="70" width="20" height="116" fill="#ffd43b"/>
    <rect x="178" y="70" width="20" height="116" fill="#d4af37"/>
    <!-- mitad superior clara / inferior oscura -->
    <rect x="34" y="70" width="188" height="58" fill="#fff" opacity="0.18"/>
    <rect x="34" y="128" width="188" height="58" fill="#5a3a00" opacity="0.18"/>
  </g>
</svg>
